<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>배진영 ♥ 김소은 결혼식</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f7f4ef;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px 0 40px;
    }
    .card-wrapper {
      position: relative;
      max-width: 420px;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }
    .card-wrapper img {
      width: 100%;
      display: block;
    }
    .button-bar {
      position: absolute;
      bottom: 18px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 14px;
      padding: 0 16px;
    }
    .btn {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(6px);
      color: #4a3f35;
      border: 1px solid rgba(255,255,255,0.8);
      padding: 11px 22px;
      border-radius: 28px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:active { transform: scale(0.97); }
    .btn.kakao { background: #FEE500; color: #3c1e1e; border-color: #FEE500; }
  </style>

    function shareKakao() {
      const url = window.location.href;
      const title = '배진영 ♥ 김소은 결혼식';
      const description = '2026년 12월 13일 오전 11시 30분\n반월정 (대구광역시 중구 달구벌대로 2061-2)';

      if (/Android|iPhone|iPad/i.test(navigator.userAgent)) {
        // 카카오 공유 스킴 또는 웹 공유
        const kakaoUrl = `kakaotalk://send?text=${encodeURIComponent(title + '\n' + description + '\n' + url)}`;
        window.location.href = kakaoUrl;
        // 실패 시 fallback
        setTimeout(() => {
          if (document.hidden === false) {
            openShareFallback(title, description, url);
          }
        }, 1500);
      } else {
        openShareFallback(title, description, url);
      }
    }
