<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배진영 ♥ 김소은 | 결혼합니다</title>
  
  <meta property="og:title" content="배진영 ♥ 김소은 결혼합니다">
  <meta property="og:description" content="2026년 12월 13일, 저희의 새로운 시작을 축복해 주세요">
  <meta property="og:image" content="https://xcverbjy.github.io/invite.io/images/og.jpg">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f7f4ef;
      --marble: #faf8f5;
      --text: #3a342e;
      --gold: #c4a574;
      --gold-soft: #d4b896;
      --line: #e8e0d6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
      font-weight: 300;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      background: var(--marble);
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(212,184,150,0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(196,165,116,0.06) 0%, transparent 45%),
        radial-gradient(circle at 40% 80%, rgba(255,255,255,0.4) 0%, transparent 50%);
      pointer-events: none;
    }

    section {
      padding: 80px 32px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .cover { padding-top: 120px; padding-bottom: 100px; }

    .names {
      font-family: 'Playfair Display', 'Cormorant Garamond', serif;
      font-size: 42px;
      font-weight: 400;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    .heart { color: var(--gold); font-size: 24px; margin: 0 8px; }

    .date-main {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      letter-spacing: 3px;
      color: var(--gold);
      margin-top: 24px;
      font-weight: 500;
    }

    .subtitle { font-size: 14px; letter-spacing: 2px; color: #8a7f74; margin-top: 8px; }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--gold);
      margin: 40px auto;
      opacity: 0.6;
    }

    .greeting p { font-size: 15px; line-height: 2; margin-bottom: 20px; color: #4a433c; }

    .photos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 24px;
    }

    .photos img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      border-radius: 4px;
    }

    .kakao-guide {
      background: rgba(255,255,255,0.5);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px 20px;
      margin-top: 16px;
    }

    .kakao-guide p {
      font-size: 15px;
      line-height: 1.9;
      color: #4a433c;
    }

    .closing { font-family: 'Cormorant Garamond', serif; font-size: 16px; letter-spacing: 1px; margin-top: 40px; }

    @media (max-width: 480px) {
      .names { font-size: 36px; letter-spacing: 2px; }
      section { padding: 60px 24px; }
      .cover { padding-top: 100px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="cover">
      <div class="names">배진영 <span class="heart">♥</span> 김소은</div>
      <div class="divider"></div>
      <div class="date-main">2026. 12. 13</div>
      <div class="subtitle">SUNDAY</div>
    </section>

    <section class="greeting">
      <div class="divider"></div>
      <p>사랑하는 분들께</p>
      <p>저희 두 사람이<br>서로의 평생을 함께하기로 하였습니다.</p>
      <p>소소한 마음으로 준비한 스몰웨딩이라<br>직접 모시지 못하게 되어 마음이 무겁습니다.</p>
      <p>멀리서나마 저희의 시작을<br>따뜻하게 축복해 주신다면<br>더없이 큰 힘이 되겠습니다.</p>
      <p>항상 곁에서 응원해 주셔서 감사합니다.</p>
    </section>

    <section>
      <div class="photos">
        <img src="images/photo1.jpg" alt="사진1">
        <img src="images/photo2.jpg" alt="사진2">
        <img src="images/photo3.jpg" alt="사진3">
        <img src="images/photo4.jpg" alt="사진4">
      </div>
    </section>

    <section>
      <div class="divider"></div>
      <div style="font-size: 12px; letter-spacing: 2px; color: var(--gold); margin-bottom: 20px;">마음 전할 곳</div>
      
      <div class="kakao-guide">
        <p>
          마음 전하고 싶으신 분들은<br>
          카카오톡으로 연락 부탁드립니다.
        </p>
      </div>
    </section>

    <section>
      <div class="divider"></div>
      <p>저희의 새로운 시작을<br>마음 깊이 축복해 주세요.</p>
      <div class="closing">배진영 · 김소은 올림</div>
    </section>
  </div>
</body>
</html>
